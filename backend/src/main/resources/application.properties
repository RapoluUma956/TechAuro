spring.application.name=asset-management

# Server Port
server.port=${PORT:8080}

# Active Profile: Defaults to 'local' for local development; Render sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common JPA & Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# Database Configuration
# - Local Development: uses postgres / 123456789 on localhost:5432/asset_management
# - Render Production: uses DB_URL, DB_USERNAME, DB_PASSWORD environment variables
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/asset_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

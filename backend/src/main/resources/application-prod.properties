# ==============================================================================
# PRODUCTION (RENDER) PROFILE
# Activated on Render via: SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Supabase PostgreSQL connection injected by Render environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production safety: never alter production tables automatically
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

server.port=${PORT:8080}

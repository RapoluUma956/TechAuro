# ==============================================================================
# LOCAL DEVELOPMENT PROFILE (SPRING_PROFILES_ACTIVE=local)
# ==============================================================================
# Local: defaults to postgres / 123456789 on localhost:5432/asset_management
# Render: falls back to DB_URL, DB_USERNAME, DB_PASSWORD if deployed with default profile
spring.datasource.url=${LOCAL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/asset_management}}
spring.datasource.username=${LOCAL_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${LOCAL_DB_PASSWORD:${DB_PASSWORD:123456789}}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
server.port=${PORT:8080}
